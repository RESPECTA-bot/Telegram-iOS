name: Build RespeGram IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', '.bazelrc') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      # ============ ГЕНЕРИРУЕМ ВАЛИДНУЮ ЗАГЛУШКУ ПРОФИЛЯ ============
      - name: Create fake-codesigning profile
        run: |
          set -e
          mkdir -p build-system/fake-codesigning/profiles

          # Генерируем самоподписанный сертификат и ключ (живут 1 день, для CI хватит)
          openssl req -x509 -newkey rsa:2048 \
            -keyout /tmp/fake.key -out /tmp/fake.crt \
            -days 1 -nodes -subj "/CN=Fake Profile"

          # Создаём минимальный plist (содержимое профиля)
          cat > /tmp/fake.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Name</key>
            <string>Fake Profile</string>
            <key>UUID</key>
            <string>00000000-0000-0000-0000-000000000000</string>
          </dict>
          </plist>
          EOF

          # Подписываем plist и сохраняем как .mobileprovision
          openssl smime -sign \
            -in /tmp/fake.plist \
            -signer /tmp/fake.crt \
            -inkey /tmp/fake.key \
            -outform DER \
            -nodetach \
            -out build-system/fake-codesigning/profiles/fake.mobileprovision

          # Проверяем, что файл читается той же командой, которой его будет проверять Bazel
          openssl smime -inform der -verify -noverify -in build-system/fake-codesigning/profiles/fake.mobileprovision

          ls -la build-system/fake-codesigning/profiles

      # ============ ГЕНЕРАЦИЯ XCODE-ПРОЕКТА ============
      - name: Generate Xcode project
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            generateProject \
            --configurationPath=build-system/Make/Configuration/appstore.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --disableExtensions \
            --disableProvisioningProfiles

      # ============ СБОРКА ПРИЛОЖЕНИЯ ============
      - name: Build Swiftgram app
        run: |
          xcodebuild \
            -project Telegram/Swiftgram.xcodeproj \
            -scheme Swiftgram \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            build

      # ============ УПАКОВКА В .IPA ============
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Swiftgram.app Payload/
          zip -r RespeGram.ipa Payload
          ls -lh RespeGram.ipa

      # ============ ЗАГРУЗКА АРТЕФАКТА ============
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RespeGram-ipa
          path: RespeGram.ipa
          retention-days: 30
