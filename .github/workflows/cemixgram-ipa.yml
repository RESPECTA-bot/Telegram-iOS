name: Build RespeGram IPA

on:
  workflow_dispatch:      # Ручной запуск кнопкой в GitHub
  push:
    branches: [ master, main ] # Автозапуск при пуше

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', '.bazelrc') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      # ============ ГЕНЕРАЦИЯ FAKE-ПРОФИЛЯ ============
      - name: Create fake-codesigning profile
        run: |
          set -e
          mkdir -p build-system/fake-codesigning/profiles

          # Пытаемся вытащить bundle_id и team_id из appstore.json. 
          # Если не получится, используем дефолтные значения.
          BUNDLE_ID=$(python3 -c "import json; print(json.load(open('build-system/Make/Configuration/appstore.json')).get('bundle_id', 'org.telegram.Telegram'))" || echo "org.telegram.Telegram")
          TEAM_ID=$(python3 -c "import json; print(json.load(open('build-system/Make/Configuration/appstore.json')).get('team_id', 'C67CF9S4VU'))" || echo "C67CF9S4VU")

          # Генерируем самоподписанный сертификат
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/fake.key -out /tmp/fake.crt -days 1 -nodes -subj "/CN=Fake Profile"

          # Создаём plist с правильной структурой Entitlements (Именно этого не хватало!)
          cat <<EOF > /tmp/fake.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Name</key>
            <string>Fake Profile</string>
            <key>UUID</key>
            <string>00000000-0000-0000-0000-000000000000</string>
            <key>TeamIdentifier</key>
            <array>
              <string>$TEAM_ID</string>
            </array>
            <key>ApplicationIdentifierPrefix</key>
            <array>
              <string>$TEAM_ID</string>
            </array>
            <key>Entitlements</key>
            <dict>
              <key>application-identifier</key>
              <string>$TEAM_ID.$BUNDLE_ID</string>
              <key>aps-environment</key>
              <string>development</string>
              <key>com.apple.developer.team-identifier</key>
              <string>$TEAM_ID</string>
              <key>keychain-access-groups</key>
              <array>
                <string>$TEAM_ID.$BUNDLE_ID</string>
              </array>
            </dict>
          </dict>
          </plist>
          EOF

          # Подписываем plist и сохраняем как .mobileprovision
          openssl smime -sign -in /tmp/fake.plist -signer /tmp/fake.crt -inkey /tmp/fake.key -outform DER -nodetach -out build-system/fake-codesigning/profiles/fake.mobileprovision

          # Проверяем, что файл читается
          openssl smime -inform der -verify -noverify -in build-system/fake-codesigning/profiles/fake.mobileprovision

          echo "Profile generated with Team ID: $TEAM_ID and Bundle ID: $BUNDLE_ID"
          ls -la build-system/fake-codesigning/profiles

      # ============ ГЕНЕРАЦИЯ XCODE-ПРОЕКТА ============
      - name: Generate Xcode project
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            generateProject \
            --configurationPath=build-system/Make/Configuration/appstore.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --disableExtensions \
            --disableProvisioningProfiles

      # ============ СБОРКА ПРИЛОЖЕНИЯ ============
      - name: Build Swiftgram app
        run: |
          xcodebuild \
            -project Telegram/Swiftgram.xcodeproj \
            -scheme Swiftgram \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            build

      # ============ УПАКОВКА В .IPA ============
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Swiftgram.app Payload/
          zip -r RespeGram.ipa Payload
          ls -lh RespeGram.ipa

      # ============ ЗАГРУЗКА АРТЕФАКТА ============
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RespeGram-ipa
          path: RespeGram.ipa
          retention-days: 30
