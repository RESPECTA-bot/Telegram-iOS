name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install dependencies
        run: |
          brew install cmake ninja yasm xcbeautify

      - name: Generate Project
        run: |
          python3 build-system/Make/Make.py generateProject --configurationPath build-system/Make/Configuration/appstore.json --xcodeManagedCodesigning

      - name: Build App
        run: |
          python3 build-system/Make/Make.py build --buildNumber=1 --configurationPath build-system/Make/Configuration/appstore.json --configuration=release_arm64 --xcodeManagedCodesigning --disableProvisioningProfiles --bazelArguments=--//Telegram:disableExtensions

      - name: Package into IPA
        run: |
          mkdir Payload
          cp -r build/Release-iphoneos/Telegram.app Payload/
          zip -r RespeGram.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RespeGram-iOS
          path: RespeGram.ipa
